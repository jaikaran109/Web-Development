<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise - 8e</title>
    <style>
        p{
            font-family: Arial;
            font-size: 30px;
        }
        input{
            display: block;
            margin-bottom: 8px;
            border: none;
            background-color: rgb(240, 240, 240);
            padding: 8px;
            width: 300px;
        }
        .uber-request{
            background-color: black;
            color: white;
            padding: 10px;
            border: none;
            margin-right: 10px;
            margin-top: 10px;

        }
        .uber-schedule{
            background-color: rgb(240, 240, 240);
            padding: 10px 15px;
            border: none;
        }
    </style>
</head>
<body>
    <p>
        Request a ride now
    </p>
    <input type="text" placeholder="Enter Pickup Location">
    <input type="text" placeholder="Enter Destination">
    <button class="uber-request">
        Request Now
    </button>
    <button class="uber-schedule">
        Schedule for later
    </button>
</body>
</html>
