<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise - 8d</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
        }

        input{
            border: 1px solid rgb(200, 200, 200);
            padding: 12px 16px;
            font-size: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .one,
        .two{
            width: 164px;   
        }

        .three{
            display: block;
            width: 336px;
        }

        button{
            border: none;
            border-radius: 8px;
            background-color: rgb(47,127,231);
            color: white;
            padding: 14px 0;
            width: 336px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <input class="one" type="text" placeholder="First Name">
    <input class="two" type="text" placeholder="Last Name">
    <input class="three" type="text" placeholder="Email">
    <button>
        Sign Up
    </button>
</body>
</html>
