<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise - 9e</title>
    <style>
        div{
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.3);
            padding: 12px 12px;
            width: 450px;
            border-radius: 5px;
        }
        img{
            width: 50px;
            height: 50px;
            border-radius: 25px;
            object-fit: cover;
            margin-left: 5px;
            vertical-align: middle;
        }
        input{
            font-size: 15px;
            border: none;
            width: 300px;
            vertical-align: middle;
        }
        button{
            border: none;
            border-radius: 30px;
            padding: 10px 20px;
            background-color: rgb(29,155,240);
            color: white;
            font-weight: bold;
            font-size: 15px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div>
        <img class="img" src="image/image.png">
        <input type="text" placeholder="What's happening?">
        <button>
            Tweet
        </button>
    </div>
</body>
</html>
