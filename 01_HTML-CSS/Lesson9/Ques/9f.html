<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise - 9f</title>
    <style>
        div{
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
            width: 200px;
            
        }
        img{
            width: 200px;
            height: 200px;
            object-fit: cover;
            margin-bottom: 15px;
        }
        p{
            font-family: Arial;
            margin-top: 0;
            margin-bottom: 0;
        }
        .name{
            font-weight: bold;

        }
        .frnd{
            color: rgb(100,100,100);
            margin-left: 8px;
            margin-bottom: 10px;
        }
        .add{
            background-color: rgb(24,119,242);
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            font-size: 15px;
            margin-left: 8px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div>
        <img class="img" src="image/image.png">
        <p class="name">
            Oliver
        </p>
        <p class="frnd">
            2 mutual friends

        <button class="add">

    </div>

</html>
