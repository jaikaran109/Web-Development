<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkdIn signup</title>
    <style>
        input{
            border-radius: 5px;
            width: 400px;
            padding: 10px 10px;
            border-color:rgb(100,100,100);
            font-size: 15px;
            border-style: solid;
            margin-bottom: 20px;
        }
        p{
            font-family: Arial;
            color: rgb(100,100,100);
            margin-top: 0;
            margin-bottom: 0;
        }
        .email{
            font-size: 15px;
            margin-bottom: 10px;
        }
        .content{
            font-size: 15px;
            margin-bottom: 20px;
        }
        button{
            background-color: rgb(10,102,194);
            color: white;
            border: none;
            border-radius: 20px;
            width: 400px;
            padding: 10px;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <p class="email">
        Email
    </p>
    <input type="text">
    <p class="content">
        By clicking Agree & Join , you agree to the Privacy Policy.
    </p>
    <button>
        Agree & Join
    </button>
</body>
</html>
