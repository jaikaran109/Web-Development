<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tweeter Text Box</title>
    <style>
        .img{
            width: 50px;
            height: 50px;
            border-radius: 25px;
            object-fit: cover;
            vertical-align: middle;
            margin-right: 5px;
        }
        input{
            font-size: 15px;
            border: none;
            width: 300px;
            vertical-align: middle;
        }
        button{
            background-color: rgb(29,155,240);
            color:white;
            border:none;
            padding: 8px 16px;
            font-size: 15px;
            font-weight: bold;
            vertical-align: middle;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <img class="img" src="image/image.png">
    <input type="text" placeholder="What's happening?">
    <button>Tweet</button>
</body>
</html>
