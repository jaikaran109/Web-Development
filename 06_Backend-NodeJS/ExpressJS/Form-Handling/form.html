<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Form</title>
</head>
<body>
    <h2>Register</h2>
    <form action="/register" method="POST">  <!-- Submit pe click krte hi /register page pe direct ho jaoge -->
        <input type="text" name="username" placeholder="Username" />
        <br><br>
        <input type="password" name="password" placeholder="Password">
        <br><br>
        <input type="text" name="city" placeholder="City">
        <br><br>
        <button type="submit">Submit</button>  <!-- Submit karte hi POST request automatically fire ho jati hai. -->
    </form>
</body>
</html>
